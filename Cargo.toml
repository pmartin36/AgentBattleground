[workspace]
resolver = "2"
members = [
    "crates/scene-core",
    "crates/scene-core-derive",
    "crates/render",
    "crates/game",
    "crates/inspector",
]
exclude = ["experiments"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
eframe = "0.35"
egui = "0.35"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
